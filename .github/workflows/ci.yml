name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in TEA UI is allowed to depend on anything outside this repository.
  # The jobs below assume zero HSM/LUTEA coupling, and this makes an accidental
  # dependency fail at install time rather than at review time.
  CI: true

jobs:
  verify:
    name: Verify (typecheck, lint, test, boundaries, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, component and accessibility tests
        run: npm run test

      - name: Build the stylesheet
        run: npm run build:css

      - name: Build the library
        run: npm run build:packages

      - name: Inspect the build artefacts
        if: always()
        run: node scripts/inspect-dist.mjs

      - name: Verify the skill is usable outside this repository
        run: node scripts/skill-sync.mjs --check

      - name: Verify the public export contract
        run: npm run check:exports

      - name: Measure tree-shaking
        run: npm run check:tree

      - name: Upload the measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: reports/
          if-no-files-found: ignore

  apps:
    name: Build showcase and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Build the Showcase
        run: npm run showcase:build
      - name: Build the documentation
        run: npm run docs:build

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # Runs only when a reference image exists; the first run uploads baselines
    # instead of failing, so a new checkout does not start red.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run build:packages
      - name: Capture
        run: npm run test:visual --if-present
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
