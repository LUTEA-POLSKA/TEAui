name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in TEA UI is allowed to depend on anything outside this repository.
  # The jobs below assume zero HSM/LUTEA coupling, and this makes an accidental
  # dependency fail at install time rather than at review time.
  CI: true

jobs:
  verify:
    name: Verify (typecheck, lint, test, boundaries, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, component and accessibility tests
        run: npm run test

      - name: Build the stylesheet
        run: npm run build:css

      - name: Build the library
        run: npm run build:packages

      - name: Inspect the build artefacts
        if: always()
        run: node scripts/inspect-dist.mjs

      - name: Verify the public export contract
        run: npm run check:exports

      - name: Measure tree-shaking
        run: npm run check:tree

      - name: Upload the measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: reports/
          if-no-files-found: ignore

  apps:
    name: Build showcase and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Build the Showcase
        run: npm run showcase:build
      - name: Build the documentation
        run: npm run docs:build

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    # Runs only when a reference image exists; the first run uploads baselines
    # instead of failing, so a new checkout does not start red.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run build:packages
      - name: Capture
        run: npm run test:visual --if-present
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [verify, apps]
    # Only from main, only when the working tree actually contains a pending
    # changeset. A version bump is a consequence of a merged change, never a
    # manual step someone can forget.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Is there anything to publish?
        id: pending
        run: node scripts/has-changeset.mjs

      - name: Version
        if: steps.pending.outputs.pending == 'true'
        run: npm run version

      - name: Build
        if: steps.pending.outputs.pending == 'true'
        run: npm run build:css && npm run build:packages

      - name: Publish to npm
        if: steps.pending.outputs.pending == 'true'
        run: npm publish --workspaces --access restricted --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push the version commit
        if: steps.pending.outputs.pending == 'true'
        run: |
          git config user.name "tea-ci"
          git config user.email "ci@tea.local"
          git push origin main --follow-tags
